<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Going Merry anatomy</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso-page{width:min(900px,100% - 16px);margin:8px auto 12px}
.mr{margin:0}
.mr .iso-plate{padding:46px 20px 50px}
.mr-stage{position:relative;touch-action:pan-y;outline:none}
.mr-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.mr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mr .it[data-p]{cursor:pointer}

.mr{--mr-ring:#ffffff14;--mr-hover:#ffffff0a}
.iso[data-theme="light"] .mr{--mr-ring:#0000001a;--mr-hover:#0000000a}

.mr-void{fill:var(--anatomy-shade-0);stroke:none}
.mr-soil{fill:var(--anatomy-shade-0);stroke:none}
.mr-glass{fill:var(--anatomy-shade-1);stroke:none}
.mr-flag{fill:var(--anatomy-hi);stroke:none}
.mr-bone,.mr-skull{fill:var(--anatomy-hi);stroke:none}
.mr-hole{fill:var(--anatomy-shade-2);stroke:none}
.mr-crown,.mr-brim{fill:var(--anatomy-mid);stroke:none}
.mr-band{fill:var(--anatomy-hi);stroke:none}
.mr-emblem{pointer-events:none}
.mr-fruit circle{opacity:1!important}

/* one part lit, the rest steps down a tone */
.mr-stage[data-focus] .it:not([data-on]){--anatomy-hi:var(--anatomy-mid);--anatomy-mid:var(--anatomy-lo)}
.it[data-on]{--anatomy-hi:var(--anatomy-lit);--anatomy-mid:var(--anatomy-hi)}
.it[data-on] .iso-top,.it[data-on] .tb-shine{fill:var(--anatomy-lit-top)}
.it[data-on] .iso-shade,.it[data-on] .tb-body{fill:var(--anatomy-lit-shade)}
.it[data-on] [data-seamless]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.it[data-on] [data-seamless]>.iso-top{stroke:var(--anatomy-lit-top)}

.mr-parts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.mr-part{display:inline-flex;align-items:baseline;gap:7px;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--anatomy-muted);font:12.5px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;cursor:pointer;box-shadow:inset 0 0 0 1px var(--mr-ring);transition:color 160ms var(--anatomy-ease),background 160ms var(--anatomy-ease)}
.mr-part:hover,.mr-part:focus-visible,.mr-part[data-on]{color:var(--anatomy-strong);background:var(--mr-hover);outline:none}
.mr-part:focus-visible{box-shadow:inset 0 0 0 1px var(--anatomy-muted)}
.mr-num{font-family:var(--anatomy-mono);font-size:10px;color:var(--anatomy-muted)}
.mr-caption{display:block;color:var(--anatomy-text)}
html[lang="ja"] body{font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}

@media (max-width:560px){
  .mr .iso-plate{padding:42px 6px 62px}
  .mr .iso-plate-corner[data-corner="readout"]{max-width:62%;overflow:hidden;text-overflow:ellipsis}
  .mr .iso-plate-corner[data-corner="title"]{max-width:60%;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:560px){
  .mr .iso-plate{overflow:hidden}
  .mr-stage svg{width:124%;margin:-4% 0 -2% -12%}
}

utton type="button" class="mr-part" data-part="rudder"><span class="mr-num">11</span>Rudder</button><button type="button" class="mr-part" data-part="keel"><span class="mr-num">12</span>Keel</button></span><span class="iso-caption mr-caption" data-caption>The Going Merry was the first ship of the Straw Hat Pirates. She is a caravel designed by Merry, the butler of Kaya, and Kaya gave her to the crew at Syrup Village. Here the near side of the hull and half of the deck are cut away to show the rooms inside and the keel along the bottom.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));

    skull: [...emRing(0, 46, 14, 13, 30, Math.PI * 0.82, Math.PI * 2.18), [7.5, 60], [7.5, 63], [-7.5, 63], [-7.5, 60]],
    holes: [emRing(-5.4, 48, 3.6, 4, 16), emRing(5.4, 48, 3.6, 4, 16), [[0, 53], [2, 56.4], [-2, 56.4]]],
    crown: [[-11, 37], ...emRing(0, 37, 11, 9, 20, Math.PI, Math.PI * 2).slice(1, -1), [11, 37]],
    band: [[-11.2, 34.4], [11.2, 34.4], [11.4, 37.2], [-11.4, 37.2]],
    brim: emRing(0, 37.6, 21, 3.6, 30),
  };
})();

function sailParts(bulge, P) {
  const grid = [];
  for (let i = 0; i <= SAIL.cols; i++) {
    const u = -1 + (2 * i) / SAIL.cols;
    const row = [];
    for (let j = 0; j <= SAIL.rows; j++) row.push(sailPoint(u, j / SAIL.rows, bulge));
    grid.push(row);
  }
  const paths = shellPaths(grid, P, { normalSign: -1 });
  const toScreen = ([a, b]) => {
    const v = b / SAIL.drop;
    const half = SAIL.half0 + (SAIL.half1 - SAIL.half0) * v;
    return iso(sailPoint(a / half, v, bulge), P);
  };
  const shape = (points) => pathOf(points.map(toScreen), true);
  const seams = [-0.72, -0.43, -0.14, 0.14, 0.43, 0.72].map((u) => pathOf(Array.from({ length: SAIL.rows + 1 }, (_, j) => iso(sailPoint(u, j / SAIL.rows, bulge), P)))).join("");
  return {
    paths,
    seams,
    bones: EMBLEM.bones.map(shape).join("") + EMBLEM.knobs.map(shape).join(""),
    skull: shape(EMBLEM.skull),
    holes: EMBLEM.holes.map(shape).join(""),
    crown: shape(EMBLEM.crown),
    band: shape(EMBLEM.band),
    brim: shape(EMBLEM.brim),
  };
}

const D = {"P":{"origin":[383.5768718374382,402.9874782814385],"scale":1.2810569954884592,"azimuth":62,"elevation":26},"order":["head","mast","nest","sail","trees","galley","men","women","hold","cannons","rudder","keel"],"names":{"head":"Sheep's head figurehead","mast":"Main mast","nest":"Crow's nest","sail":"Sail and jolly roger","trees":"Tangerine trees","galley":"Galley","men":"Men's quarters","women":"Women's quarters","hold":"Storage hold","cannons":"Cannons","rudder":"Rudder","keel":"Keel"},"texts":{"head":"A sheep's head with curled horns sits on the bow. It is the feature that makes the Going Merry easy to recognize.","mast":"The ship's only mast. It holds up the crow's nest and the square sail with the jolly roger.","nest":"The lookout platform near the top of the main mast, where the crew keeps watch.","sail":"The single square sail carries the Straw Hat jolly roger and fills as it takes the wind.","trees":"The tangerine trees on the upper rear deck came from Bell-mère's orchard in Cocoyashi Village, Nami's home.","galley":"The galley and dining room in the stern cabin.","men":"The men's quarters, below deck at the bow.","women":"The women's quarters, below deck at the stern.","hold":"The storage hold below deck, where food and cargo are kept.","cannons":"The ship's cannons. Usopp, the crew's sniper, handled the cannon fire.","rudder":"The rudder hangs from the stern and steers the ship.","keel":"The keel is the backbone along the bottom, and every rib rises from it. At Water 7 the shipwrights found the keel damaged beyond repair, so the crew had to part with her. After Enies Lobby they gave her a Viking funeral at sea, and Luffy set her alight."},"idle":"caravel · 12 parts","caption":"The Going Merry was the first ship of the Straw Hat Pirates. She is a caravel designed by Merry, the butler of Kaya, and Kaya gave her to the crew at Syrup Village. Here the near side of the hull and half of the deck are cut away to show the rooms inside and the keel along the bottom.","pivot":[383.6,359.3],"rest":9};
const MP = D.P;
const stage = document.querySelector(".mr-stage");
const svg = stage.querySelector("svg");
const ship = svg.querySelector("[data-ship]");
const sailBody = svg.querySelector("[data-sail-body]");
const emblem = {};
for (const name of ["bone", "skull", "hole", "crown", "band", "brim"]) emblem[name] = svg.querySelector(".mr-" + name);
const readout = document.querySelector("[data-readout]");
const caption = document.querySelector("[data-caption]");
const status = document.querySelector("[data-status]");
const buttons = [...document.querySelectorAll(".mr-part")];
const groups = {};
for (const g of svg.querySelectorAll(".it[data-p]")) (groups[g.dataset.p] ??= []).push(g);
const still = matchMedia("(prefers-reduced-motion: reduce)");
const up = axisVector(MP, [0, 0, 1]);

// ---- height for the embedding page ----
let heightFrame = 0;
function postHeight() {
  if (heightFrame) return;
  // 画面外や背面タブでは rAF が止まるので、タイマーで送る
  heightFrame = setTimeout(() => {
    heightFrame = 0;
    try {
      parent.postMessage({ type: "anatomy-height", id: "merry", height: (() => { const m = document.querySelector(".iso-page"); if (!m) return document.documentElement.scrollHeight; const cs = getComputedStyle(m); return Math.ceil(m.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom)); })() }, "*");
    } catch (error) {}
  });
}
// Keep the caption box as tall as its longest text, so the page height does not
// jump while the tour steps through the parts.
function fitCaption() {
  caption.style.minHeight = "";
  const current = caption.textContent;
  let tallest = 0;
  for (const text of [D.caption, ...D.order.map((id) => D.texts[id])]) {
    caption.textContent = text;
    tallest = Math.max(tallest, caption.getBoundingClientRect().height);
  }
  caption.textContent = current;
  caption.style.minHeight = Math.ceil(tallest) + "px";
  postHeight();
}

// ---- selection ----
let selected = null;
function select(id, announce = false) {
  if (id === selected) return;
  if (selected) for (const g of groups[selected] || []) g.removeAttribute("data-on");
  selected = id;
  for (const b of buttons) b.toggleAttribute("data-on", b.dataset.part === id);
  if (id) {
    for (const g of groups[id] || []) g.setAttribute("data-on", "");
    stage.setAttribute("data-focus", "");
  } else stage.removeAttribute("data-focus");
  const index = D.order.indexOf(id);
  readout.textContent = id ? String(index + 1).padStart(2, "0") + " / " + D.order.length + " · " + D.names[id] : D.idle;
  caption.textContent = id ? D.texts[id] : D.caption;
  if (announce) status.textContent = id ? D.names[id] + ". " + D.texts[id] : "";
}
function step(by) {
  const index = selected ? D.order.indexOf(selected) : by > 0 ? -1 : 0;
  select(D.order[(index + by + D.order.length) % D.order.length], true);
}

// ---- tour and take-over ----
let touring = !still.matches;
let tourClock = -1.4;
let idleTimer = 0;
let hovering = false;
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches || hovering) return;
    touring = true;
    tourClock = 0;
    run();
  }, 6000);
}

// ---- motion: the hull rides a gentle swell, the sail breathes ----
let clock = 0;
let frame = 0;
let last = 0;
let visible = false;
let lastSail = -1;
function sailAt(bulge) {
  const s = sailParts(bulge, MP);
  sailBody.innerHTML = solidSvg(s.paths, { tone: "hi", inner: lineSvg(s.seams, { tone: "faint" }) });
  emblem.bone.setAttribute("d", s.bones);
  emblem.skull.setAttribute("d", s.skull);
  emblem.hole.setAttribute("d", s.holes);
  emblem.crown.setAttribute("d", s.crown);
  emblem.band.setAttribute("d", s.band);
  emblem.brim.setAttribute("d", s.brim);
}
function pose() {
  const calm = still.matches;
  const swell = calm ? 0 : Math.sin((clock * Math.PI * 2) / 6.4);
  const roll = calm ? 0 : Math.sin((clock * Math.PI * 2) / 6.4 + 1.2);
  const lift = 1.3 * swell;
  const dx = up[0] * lift;
  const dy = up[1] * lift;
  ship.setAttribute("transform", calm ? "" : "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ") rotate(" + (0.5 * roll).toFixed(3) + " " + D.pivot[0] + " " + D.pivot[1] + ")");
  const bulge = calm ? D.rest : D.rest + 2.4 * Math.sin((clock * Math.PI * 2) / 5.3 + 0.6);
  if (Math.abs(bulge - lastSail) > 0.02) {
    lastSail = bulge;
    sailAt(bulge);
  }
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) {
    tourClock += dt;
    if (tourClock >= 3.4) {
      tourClock = 0;
      step(1);
    }
  }
  pose();
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener?.("change", () => {
  if (still.matches) touring = false;
  pose();
  run();
});

// ---- input ----
const partOf = (target) => target.closest && target.closest(".it[data-p]");
svg.addEventListener("pointerover", (event) => {
  const g = partOf(event.target);
  if (!g) return;
  takeOver();
  select(g.dataset.p);
});
svg.addEventListener("click", (event) => {
  const g = partOf(event.target);
  takeOver();
  select(g ? g.dataset.p : null, true);
});
stage.addEventListener("pointerenter", () => {
  hovering = true;
});
stage.addEventListener("pointerleave", () => {
  hovering = false;
  takeOver();
});
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === "ArrowRight" || key === "ArrowDown") step(1);
  else if (key === "ArrowLeft" || key === "ArrowUp") step(-1);
  else if (key === "Home") select(D.order[0], true);
  else if (key === "End") select(D.order[D.order.length - 1], true);
  else if (key === "Escape") select(null, true);
  else return;
  event.preventDefault();
  takeOver();
});
for (const b of buttons) {
  const pick = () => {
    takeOver();
    select(b.dataset.part, true);
  };
  b.addEventListener("pointerenter", pick);
  b.addEventListener("focus", pick);
  b.addEventListener("click", pick);
  b.addEventListener("keydown", (event) => {
    const list = buttons;
    const index = list.indexOf(b);
    let next = -1;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") next = (index + 1) % list.length;
    else if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = (index - 1 + list.length) % list.length;
    if (next < 0) return;
    event.preventDefault();
    list[next].focus();
  });
}

pose();
fitCaption();
addEventListener("load", () => {
  fitCaption();
  postHeight();
});
new ResizeObserver(() => fitCaption()).observe(document.body);
